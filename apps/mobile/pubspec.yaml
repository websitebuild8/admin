version: 0.1.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.18.2
  google_maps_flutter_ios_sdk10: ^2.19.0
  clerk_flutter: 0.0.18-beta
